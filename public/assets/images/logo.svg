<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10243A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C788" />
      <stop offset="100%" stop-color="#C8A96B" />
    </linearGradient>
  </defs>
  <!-- Architectural Icon -->
  <g transform="translate(10, 10)">
    <!-- Traditional Yemeni Tower House & Modern Villa Fusion -->
    <rect x="15" y="25" width="45" height="55" rx="6" fill="url(#primaryGrad)"/>
    <polygon points="12,25 37,5 63,25" fill="url(#goldGrad)"/>
    <!-- Windows Traditional Qamariya arch pattern -->
    <circle cx="37" cy="20" r="4" fill="#FFFFFF"/>
    <rect x="23" y="34" width="10" height="12" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="42" y="34" width="10" height="12" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="23" y="52" width="10" height="12" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="42" y="52" width="10" height="12" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <!-- Main Door -->
    <path d="M 32,80 L 32,68 A 5,5 0 0,1 42,68 L 42,80 Z" fill="url(#goldGrad)"/>
  </g>
  <!-- Text Brand -->
  <text x="95" y="52" font-family="'Cairo', sans-serif" font-weight="900" font-size="36" fill="#10243A">عقار <tspan fill="#C8A96B">اليمن</tspan></text>
  <text x="95" y="76" font-family="'Cairo', sans-serif" font-weight="600" font-size="13" fill="#64748B">بيتك يبدأ من هنا • Yemen Real Estate</text>
</svg>
